<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ravenloft Music</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14131a;
    --bg-raised: #1a1922;
    --line: #26242f;
    --text: #e4dfd4;
    --text-dim: #8b859a;
    --accent: #c9a96e;
    --danger: #b06058;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.4;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  #local-controls { display: flex; align-items: center; gap: 6px; }
  .role-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }

  #app { padding: 4px 12px 90px; }

  details.folder {
    border-bottom: 1px solid var(--line);
  }
  details.folder > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 2px;
    cursor: pointer;
    list-style: none;
    font-weight: 500;
    color: var(--text);
  }
  details.folder > summary::-webkit-details-marker { display: none; }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot, var(--accent));
    flex-shrink: 0;
  }
  .folder-name { flex: 1; }

  .folder-body { padding: 0 2px 10px 15px; }

  .stream-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
  }
  .stream-main {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
  }
  .play-btn {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .play-btn.is-playing { background: var(--accent); border-color: var(--accent); color: #1a1410; }
  .play-btn:disabled { opacity: 0.35; cursor: default; }

  .stream-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  input.vol[type="range"] {
    width: 76px;
    accent-color: var(--accent);
  }

  .sfx-btn {
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    cursor: pointer;
    font-size: 12.5px;
    text-align: left;
    flex: 1;
  }
  .sfx-btn:active { background: var(--accent); color: #1a1410; }
  .sfx-btn:disabled { opacity: 0.35; cursor: default; }

  .stream-tools { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--bg-raised); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.is-active { color: var(--accent); }

  .inline-edit, .add-form-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px;
    margin: 4px 0;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .text-input {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    padding: 5px 7px;
    font-size: 12.5px;
    min-width: 0;
    flex: 1 1 100px;
  }
  .icon-input { flex: 0 0 46px; text-align: center; }
  .color-input {
    width: 32px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: none;
  }
  select.text-input { flex: 1 1 160px; }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .small-btn {
    padding: 5px 11px;
    border-radius: 4px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
  }
  .small-btn:hover { background: var(--accent); color: #1a1410; }

  .add-form { padding: 4px 0; }
  .add-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
  }
  .add-toggle:hover { color: var(--accent); }
  .add-folder-form { padding: 10px 2px 20px; }

  #unlock-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 14, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #unlock-overlay button {
    padding: 12px 18px;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--bg-raised);
    color: var(--accent);
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>Ravenloft Music</h1>
    <div style="display:flex; align-items:center; gap:6px;">
      <button id="edit-toggle" class="icon-btn" title="Режим редактирования" hidden>✎</button>
      <div id="local-controls" style="display:flex; align-items:center; gap:6px;"></div>
    </div>
  </header>
  <div id="app"></div>

  <div id="unlock-overlay" hidden>
    <button type="button">🔈 Включить звук в этой вкладке</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
